<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rectifier Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#e9e8e1;--card:#f8f7f2;--fg:#17262a;--mut:#5f7377;--bd:#c3cbc7;--acc:#006d8f;--g:#0a8f4a;--o:#b86e00;--p:#6a4bc4;--r:#c42846;--wire:#a3afab;--grid:#17262a12;--glow:0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04070a;--card:#091014;--fg:#d3ebe3;--mut:#6c8c86;--bd:#1b2c31;--acc:#00e5ff;--g:#39ff88;--o:#ffb000;--p:#c792ff;--r:#ff4d6d;--wire:#2b4248;--grid:#39ff8812;--glow:1}}
:root[data-theme="dark"]{--bg:#04070a;--card:#091014;--fg:#d3ebe3;--mut:#6c8c86;--bd:#1b2c31;--acc:#00e5ff;--g:#39ff88;--o:#ffb000;--p:#c792ff;--r:#ff4d6d;--wire:#2b4248;--grid:#39ff8812;--glow:1}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:14px;max-width:1400px;margin:0 auto}
h1{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 calc(var(--glow)*10px) var(--g)}
h1 small{margin-left:auto;font-size:10px;color:var(--mut);letter-spacing:.15em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:14px;margin-bottom:14px;position:relative;box-shadow:inset 0 0 40px #0000000d}
.card::before,.card::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--acc);opacity:.8}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:3px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--bd);background:transparent;color:var(--mut);padding:8px 13px;cursor:pointer;font:inherit;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.seg button:last-child{border-right:0}
.seg button.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);box-shadow:inset 0 -2px var(--acc)}
.lab{font-size:10px;color:var(--mut);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.14em}
label.s{display:flex;flex-direction:column;min-width:150px;flex:1}
label.s b{font-weight:700;color:var(--acc);letter-spacing:0}
input[type=range]{width:100%;accent-color:var(--acc)}
button.play{border:1px solid var(--g);background:transparent;color:var(--g);border-radius:3px;padding:8px 16px;cursor:pointer;font:inherit;text-transform:uppercase;letter-spacing:.1em;font-size:11px}
button.play:hover{background:color-mix(in srgb,var(--g) 15%,transparent)}
.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
canvas{width:100%;display:block;touch-action:none;border-radius:2px;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px}
#sch{height:300px}#wav{height:400px;cursor:ew-resize}
.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.m div{border-left:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent);padding:8px 10px}
.m span{font-size:10px;color:var(--mut);display:block;text-transform:uppercase;letter-spacing:.12em}
.m b{font-size:17px;color:var(--g);text-shadow:0 0 calc(var(--glow)*8px) var(--g)}
.id{margin:-6px 0 14px;font-size:12px;color:var(--mut);letter-spacing:.08em}.id b{color:var(--fg)}
footer{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.1em;padding:4px 0 10px}
.leg{font-size:11px;color:var(--mut);margin-top:8px}
</style></head><body>
<h1>Rectifier Lab<small>DIODE · THYRISTOR · 1φ / 3φ</small></h1>
<div class="id">Name: <b>Trivedi Rishi Tejas</b> &nbsp;|&nbsp; Roll No.: <b>24EE10103</b></div>
<div class="card"><div class="row">
 <div><span class="lab">Supply</span><div class="seg" id="sPh"><button data-v="1" class="on">1-phase</button><button data-v="3">3-phase</button></div></div>
 <div><span class="lab">Bridge type</span><div class="seg" id="sTy"><button data-v="diode">Diode</button><button data-v="half">Half-controlled</button><button data-v="full" class="on">Fully controlled</button></div></div>
 <label class="s"><span class="lab">Firing angle α: <b id="vA">30°</b></span><input id="iA" type="range" min="0" max="180" value="30"></label>
 <label class="s"><span class="lab">R: <b id="vR">20 Ω</b></span><input id="iR" type="range" min="1" max="50" value="20"></label>
 <label class="s"><span class="lab">L: <b id="vL">45 mH</b></span><input id="iL" type="range" min="1" max="200" value="45"></label>
</div></div>
<div class="grid">
 <div class="card"><canvas id="sch"></canvas><div class="leg" id="mode"></div></div>
 <div class="card"><canvas id="wav"></canvas>
  <div class="row" style="margin-top:8px"><button class="play" id="pl">▶ Play</button>
  <label class="s" style="flex:3"><span class="lab">Angle ωt: <b id="vT">0°</b> (or drag on the plot)</span><input id="iT" type="range" min="0" max="359.5" step="0.5" value="0"></label></div></div>
</div>
<div class="card m">
 <div><span>V<sub>o</sub> average</span><b id="mVa"></b></div><div><span>V<sub>o</sub> RMS</span><b id="mVr"></b></div>
 <div><span>Ideal V<sub>avg</sub> (CCM formula)</span><b id="mVt"></b></div>
 <div><span>I<sub>o</sub> average</span><b id="mIa"></b></div><div><span>Conduction</span><b id="mCm"></b></div>
 <div><span>Conducting now</span><b id="mSw"></b></div>
</div>
<script>
const D=Math.PI/180,N=1440,W=2*Math.PI*50,Vm=325,TP=2*Math.PI;
const S={ph:1,ty:'full',a:30,R:20,L:45,ang:0,play:false};
let sim,$=id=>document.getElementById(id);
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function simulate(){
 const R=S.R,L=S.L/1000,al=(S.ty==='diode'?0:S.a)*D,dth=TP/N,dt=dth/W,ex=Math.exp(-R*dt/L);
 const UP=[0,0,1,1,2,2],LO=[1,2,2,0,0,1],o={vs:[],vb:[],vc:[],vo:[],io:[],is:[],m:[]};
 let th=0,thp=0,i=0,st=S.ph===1?0:-1;
 const cr=a=>{a=((a%TP)+TP)%TP;return(thp+1e-9<a&&a<=th+1e-9)||(thp+1e-9<a-TP&&a-TP<=th+1e-9);};
 for(let c=0;c<40;c++)for(let n=0;n<N;n++){
  th=n*dth;thp=th-dth;const tn=th+1e-7;
  const v=[Vm*Math.sin(tn),Vm*Math.sin(tn-TP/3),Vm*Math.sin(tn-2*TP/3)];
  let vo=0,mask=0,sg=0,up=-1,lo=-1;
  if(S.ph===1){
   const vs=v[0];
   if(S.ty==='diode')st=th<Math.PI-1e-9?1:2;
   else{if(cr(al)&&vs>=-1e-9)st=1;if(cr(al+Math.PI)&&vs<=1e-9)st=2;}
   if(st){const s=st===1?1:-1,x=s*vs,fw=x<0&&S.ty!=='full';
    vo=fw?0:x;mask=st===1?(fw?3:9):(fw?12:6);sg=fw?0:s;}
  }else{
   const mx=v.indexOf(Math.max(...v)),mn=v.indexOf(Math.min(...v));
   if(S.ty==='diode'){up=mx;lo=mn;vo=v[up]-v[lo];}
   else if(S.ty==='half'){
    for(let k=0;k<3;k++)if(cr(30*D+k*TP/3+al)&&(st<0||v[k]>=v[st]))st=k;
    if(st>=0){up=st;lo=mn;vo=v[up]-v[lo];}
   }else{
    for(let k=0;k<6;k++)if(cr(30*D+k*60*D+al)){const e=Math.sqrt(3)*Vm*Math.sin(tn+30*D-k*60*D);if(st>=0||e>-1e-6)st=k;}
    if(st>=0){up=UP[st];lo=LO[st];vo=Math.sqrt(3)*Vm*Math.sin(tn+30*D-st*60*D);}
   }
   if(up>=0)mask=(1<<up)|(1<<(3+lo));
  }
  let ni=(i-vo/R)*ex+vo/R;
  if(ni<1e-5){ni=0;if(vo<=0.5&&S.ty!=='diode')st=S.ph===1?0:-1;}
  i=ni;
  if(c===39){
   o.vs.push(v[0]);o.vb.push(v[1]);o.vc.push(v[2]);o.vo.push(vo);o.io.push(i);o.m.push(mask);
   o.is.push(S.ph===1?sg*i:(up>=0?((up===0?i:0)-(lo===0?i:0)):0));
  }
 }
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 o.va=avg(o.vo);o.vr=Math.sqrt(avg(o.vo.map(x=>x*x)));o.ia=avg(o.io);o.dcm=o.io.some(x=>x===0);
 sim=o;
}

function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,r.width,r.height];}
const isTop=id=>S.ph===1?(id===0||id===2):id<3;
const isThy=id=>S.ty==='full'||(S.ty==='half'&&isTop(id));
const NAMES1=['1','4','3','2'],NAMES3=['1','3','5','4','6','2'];
const lbl=id=>(isThy(id)?'T':'D')+(S.ph===1?NAMES1:NAMES3)[id];

function sw(x,cx,cy,id,on){
 x.save();x.translate(cx,cy);
 const col=C('--g');
 x.fillStyle=on?col:'transparent';x.globalAlpha=.22;x.fillRect(-22,-25,44,50);x.globalAlpha=1;
 x.strokeStyle=on?col:C('--wire');x.lineWidth=on?2.5:1.5;x.strokeRect(-22,-25,44,50);
 x.fillStyle=C('--card');x.beginPath();x.moveTo(-10,10);x.lineTo(10,10);x.lineTo(0,-7);x.closePath();x.fill();x.stroke();
 x.beginPath();x.moveTo(-10,-9);x.lineTo(10,-9);x.stroke();
 if(isThy(id)){x.beginPath();x.moveTo(4,3);x.lineTo(14,11);x.lineTo(20,11);x.stroke();}
 x.fillStyle=on?col:C('--mut');x.font='bold 11px ui-monospace,Menlo,monospace';x.textAlign='right';x.fillText(lbl(id),-26,-12);
 x.font='10px ui-monospace,Menlo,monospace';x.textAlign='center';x.fillText(on?'ON':'OFF',0,22);
 x.restore();
}

function drawSch(){
 const[x,w,h]=fit($('sch')),k=Math.min(w/620,h/310);
 x.clearRect(0,0,w,h);x.save();x.translate((w-620*k)/2,(h-310*k)/2);x.scale(k,k);
 const idx=Math.min(N-1,Math.floor(S.ang/360*N)),m=sim.m[idx],g=C('--g'),wr=C('--wire');
 const one=S.ph===1,lx0=one?200:190,lx=one?[200,320]:[190,290,390],rx=one?520:560;
 const legs=lx.map((X,j)=>({x:X,top:one?[0,2][j]:j,bot:one?[1,3][j]:3+j,my:one?[135,175][j]:130+25*j}));
 const dot=(X,Y,c)=>{x.fillStyle=c;x.beginPath();x.arc(X,Y,3.5,0,TP);x.fill();};
 const hop=(y,x0,x1,hs,c)=>{x.strokeStyle=c;x.lineWidth=2;x.beginPath();x.moveTo(x0,y);hs.forEach(h=>{x.lineTo(h-6,y);x.arc(h,y,6,Math.PI,TP);});x.lineTo(x1,y);x.stroke();};
 const ln=(pts,c,wd)=>{x.strokeStyle=c;x.lineWidth=wd;x.beginPath();pts.forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();};
 const on=id=>!!(m>>id&1),any=m!==0,tr=lx[lx.length-1]+0;
 ln([[lx0,40],[rx,40],[rx,120]],any?g:wr,any?3:1.5);ln([[lx0,270],[rx,270],[rx,190]],any?g:wr,any?3:1.5);
 legs.forEach(l=>{ln([[l.x,40],[l.x,l.my]],on(l.top)?g:wr,on(l.top)?3:1.5);ln([[l.x,l.my],[l.x,270]],on(l.bot)?g:wr,on(l.bot)?3:1.5);});
 // source wiring
 const mc=C('--acc');
 if(one){
  x.strokeStyle=mc;x.lineWidth=2;x.beginPath();x.arc(70,155,20,0,TP);x.stroke();
  x.beginPath();x.moveTo(58,155);x.bezierCurveTo(64,143,68,143,70,155);x.bezierCurveTo(72,167,76,167,82,155);x.stroke();
  ln([[70,135],[200,135]],mc,2);hop(175,70,320,[200],mc);dot(200,135,mc);dot(320,175,mc);
  x.fillStyle=C('--fg');x.font='11px ui-monospace,Menlo,monospace';x.textAlign='center';x.fillText('v_s = '+sim.vs[idx].toFixed(0)+' V',70,200);
  x.fillStyle=mc;x.fillText('A',105,129);x.fillText('N',105,190);
 }else{
  ln([[20,130],[20,180]],mc,2);
  ['a','b','c'].forEach((n,j)=>{const my=130+25*j;ln([[20,my],[36,my]],mc,2);
   x.strokeStyle=mc;x.lineWidth=2;x.beginPath();x.arc(45,my,9,0,TP);x.stroke();hop(my,54,lx[j],lx.slice(0,j),mc);dot(lx[j],my,mc);
   x.fillStyle=mc;x.font='bold 11px ui-monospace,Menlo,monospace';x.textAlign='left';x.fillText(n,70,my-3);});
  x.fillStyle=C('--mut');x.font='11px ui-monospace,Menlo,monospace';x.fillText('3-φ source (Y)',6,210);
 }
 legs.forEach(l=>{sw(x,l.x,95,l.top,on(l.top));sw(x,l.x,215,l.bot,on(l.bot));});
 // load
 x.fillStyle=C('--card');x.strokeStyle=any?g:wr;x.lineWidth=2;x.fillRect(rx-26,120,52,70);x.strokeRect(rx-26,120,52,70);
 x.fillStyle=C('--fg');x.font='bold 12px ui-monospace,Menlo,monospace';x.textAlign='center';x.fillText('R–L',rx,150);x.font='11px ui-monospace,Menlo,monospace';x.fillText('load',rx,166);
 x.fillStyle=C('--r');x.textAlign='left';x.fillText('+ Vo = '+sim.vo[idx].toFixed(0)+' V',rx-70,30);
 x.fillStyle=C('--o');x.fillText('io = '+sim.io[idx].toFixed(2)+' A',rx-70,295);
 x.restore();
}

function plot(x,px,py,pw,ph,series,lo,hi,title,unit,cur,dash){
 x.strokeStyle=C('--bd');x.lineWidth=1;x.strokeRect(px,py,pw,ph);
 const Y=v=>py+ph*(1-(v-lo)/(hi-lo)),X=j=>px+pw*j/N;
 x.fillStyle=C('--mut');x.font='10px ui-monospace,monospace';x.textAlign='right';
 [hi,0,lo].forEach(v=>{x.fillText(v.toFixed(0),px-4,Y(v)+3);});
 x.textAlign='center';[0,90,180,270,360].forEach(a=>{x.fillText(a+'°',px+pw*a/360,py+ph+12);
  x.strokeStyle=C('--bd');x.beginPath();x.moveTo(px+pw*a/360,py);x.lineTo(px+pw*a/360,py+ph);x.stroke();});
 x.beginPath();x.moveTo(px,Y(0));x.lineTo(px+pw,Y(0));x.stroke();
 series.forEach(s=>{x.strokeStyle=s.c;x.lineWidth=s.w||2;x.globalAlpha=s.a||1;x.setLineDash(s.d||[]);x.shadowColor=s.c;x.shadowBlur=+getComputedStyle(document.documentElement).getPropertyValue('--glow')*(s.w>2?10:4);x.beginPath();
  s.v.forEach((y,j)=>j?x.lineTo(X(j),Y(y)):x.moveTo(X(j),Y(y)));x.stroke();});
 x.setLineDash([]);x.globalAlpha=1;x.shadowBlur=0;
 if(dash!=null){x.strokeStyle=C('--p');x.setLineDash([5,4]);x.beginPath();x.moveTo(px,Y(dash));x.lineTo(px+pw,Y(dash));x.stroke();x.setLineDash([]);}
 x.fillStyle=C('--fg');x.font='bold 12px ui-monospace,Menlo,monospace';x.textAlign='left';x.fillText(title,px+8,py+15);
 x.textAlign='right';x.fillStyle=C('--mut');x.fillText('['+unit+']',px+pw-6,py+15);
 x.strokeStyle=C('--acc');x.setLineDash([4,3]);x.beginPath();x.moveTo(X(cur),py);x.lineTo(X(cur),py+ph);x.stroke();x.setLineDash([]);
 series.filter(s=>s.dot).forEach(s=>{x.fillStyle=s.c;x.beginPath();x.arc(X(cur),Y(s.v[cur]),4,0,TP);x.fill();});
}
let PL;
function drawWav(){
 const[x,w,h]=fit($('wav'));x.clearRect(0,0,w,h);
 const px=44,pw=w-58,cur=Math.min(N-1,Math.floor(S.ang/360*N)),h1=h*.5-20,h2=h*.5-34;
 PL={px,pw};
 const V=S.ph===3?600:360,mi=Math.max(...sim.io.map(Math.abs),...sim.is.map(Math.abs)),I=Math.max(5,Math.ceil(mi*1.15/5)*5);
 const vs=S.ph===1?[{v:sim.vs,c:C('--acc'),w:1.5,d:[5,4]}]:[{v:sim.vs,c:C('--acc'),w:1.2,a:.7},{v:sim.vb,c:C('--p'),w:1.2,a:.7},{v:sim.vc,c:C('--r'),w:1.2,a:.7}];
 plot(x,px,12,pw,h1,vs.concat([{v:sim.vo,c:C('--g'),w:2.5,dot:1}]),-V,V,S.ph===1?'Source v_s (dashed) & output v_o':'Phase voltages & output v_o','V',cur,sim.va);
 plot(x,px,h1+36,pw,h2,[{v:sim.is,c:C('--p'),w:1.5},{v:sim.io,c:C('--o'),w:2.5,dot:1}],-I,I,S.ph===1?'Load i_o & source i_s':'Load i_o & phase-a current i_a','A',cur);
 x.fillStyle=C('--p');x.font='11px ui-monospace,Menlo,monospace';x.textAlign='left';x.fillText('- - V_avg',px+pw-62,12+h1-6);
}

function stats(){
 $('mVa').textContent=sim.va.toFixed(1)+' V';$('mVr').textContent=sim.vr.toFixed(1)+' V';$('mIa').textContent=sim.ia.toFixed(2)+' A';
 {const a=(S.ty==='diode'?0:S.a)*D,c=Math.cos(a),k=3*Math.sqrt(3)*Vm/Math.PI;
  const t=S.ph===1?({diode:2*Vm/Math.PI,half:Vm/Math.PI*(1+c),full:2*Vm/Math.PI*c})[S.ty]:({diode:k,half:k/2*(1+c),full:k*c})[S.ty];
  $('mVt').textContent=t.toFixed(1)+' V';}
 $('mCm').textContent=sim.dcm?'DCM':'CCM';
 const idx=Math.min(N-1,Math.floor(S.ang/360*N)),m=sim.m[idx],a=[];for(let j=0;j<6;j++)if(m>>j&1)a.push(lbl(j));
 $('mSw').textContent=a.length?a.join(' + '):'none (open)';
 $('mode').textContent=(S.ph===1?'1-φ':'3-φ')+' '+({diode:'diode bridge',half:'half-controlled bridge',full:'fully controlled bridge'})[S.ty]+' — green devices conduct at the cursor angle.';
}
function draw(){drawSch();drawWav();stats();$('vT').textContent=S.ang.toFixed(1)+'°';$('iT').value=S.ang;}
function recalc(){$('iA').disabled=S.ty==='diode';$('iA').max=S.ph===3?(S.ty==='full'?120:150):180;S.a=Math.min(S.a,+$('iA').max);$('iA').value=S.a;
 $('vA').textContent=(S.ty==='diode'?0:S.a)+'°';$('vR').textContent=S.R+' Ω';$('vL').textContent=S.L+' mH';simulate();draw();}

function seg(id,key,num){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#'+id+' button').forEach(o=>o.classList.remove('on'));b.classList.add('on');
 S[key]=num?+b.dataset.v:b.dataset.v;recalc();});}
seg('sPh','ph',1);seg('sTy','ty',0);
[['iA','a'],['iR','R'],['iL','L']].forEach(([id,k])=>$(id).oninput=e=>{S[k]=+e.target.value;recalc();});
$('iT').oninput=e=>{S.ang=+e.target.value;draw();};
const setFromPtr=e=>{const r=$('wav').getBoundingClientRect();S.ang=Math.max(0,Math.min(359.5,(e.clientX-r.left-PL.px)/PL.pw*360));draw();};
let drag=false;$('wav').onpointerdown=e=>{drag=true;$('wav').setPointerCapture(e.pointerId);setFromPtr(e);};
$('wav').onpointermove=e=>{if(drag)setFromPtr(e);};$('wav').onpointerup=()=>drag=false;
let last=0;function loop(t){if(S.play){S.ang=(S.ang+(t-last)*.09)%360;draw();}last=t;requestAnimationFrame(loop);}
$('pl').onclick=()=>{S.play=!S.play;$('pl').textContent=S.play?'⏸ Pause':'▶ Play';};
addEventListener('resize',draw);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
recalc();requestAnimationFrame(loop);
</script>
<footer>Trivedi Rishi Tejas · 24EE10103 · Rectifier Lab</footer></body></html>
